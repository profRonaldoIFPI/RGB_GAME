; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Antes de compilar: gera include/web_pages.h a partir de web/*.html e
; corrige uma falha da biblioteca do servidor (veja os scripts)
extra_scripts =
    pre:scripts/embed_web.py
    pre:scripts/patch_asyncweb.py
; Tarefa de rede no núcleo 0; o loop() do jogo fica no núcleo 1
build_flags = -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    fastled/FastLED@^3.7.0
    ; versões FIXAS: o remendo de scripts/patch_asyncweb.py vale para estas
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.6.1

; Testes no computador (precisa de um compilador C++): pio test -e native
[env:native]
platform = native
test_framework = unity
