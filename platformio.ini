; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Gera include/web_pages.h a partir de web/*.html antes de compilar
extra_scripts = pre:scripts/embed_web.py
; Tarefa de rede no núcleo 0; o loop() do jogo fica no núcleo 1
build_flags = -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    fastled/FastLED@^3.7.0
    ESP32Async/ESPAsyncWebServer@^3.7.0
    ESP32Async/AsyncTCP@^3.3.0

; Testes no computador (precisa de um compilador C++): pio test -e native
[env:native]
platform = native
test_framework = unity
